<!DOCTYPE html>
<html>
<head>

</head>
<body>

<div class="space-bg"></div>

<div class="auth-container">
<div class="auth-card">

{% endif %}

<form method="POST">
<input type="email" name="email" placeholder="Enter your email" required>
<button>Send OTP</button>
</form>

<div class="links">
<a href="/">Back to login</a>
</div>

</div>
</div>

</body>
</html>
