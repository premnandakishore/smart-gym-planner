<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weekly Workout Plan</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<!-- Animated background (same as login/register) -->
<div class="space-bg"></div>

<div class="dashboard">

    <!-- TOP BAR -->
    <div class="top-bar">
        <h1>📅 Weekly Workout Plan</h1>
    </div>

    {% for day, data in plan.items() %}
    <div class="dashboard-card">
        <h3>{{ day }} – {{ data[0] }}</h3>
        <ul>
            {% for ex in data[1] %}
                <li>{{ ex }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endfor %}

    <!-- ACTIONS -->
    <div class="dashboard-actions">
        <a href="/" class="action-btn">Back to Dashboard</a>
        <a href="/download-plan" class="action-btn">Download Plan</a>
    </div>

</div>
<div class="dashboard-actions">

    <a href="/dashboard" class="action-btn">
        🔙 Back to Dashboard
    </a>

    <a href="/download-plan" class="action-btn">
        ⬇ Download Plan
    </a>

    <a href="/logout" class="action-btn logout-btn">
        🚪 Logout
    </a>

</div>

</body>
</html>
